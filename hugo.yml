baseURL: "https://TheBoyWithDempseyRoll.github.io/"
title: "From Whale Island to the Pequod"
theme: "PaperMod"

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

pagination:
  pagerSize: 5

enableInlineShortcodes: true
enableEmoji: true

languages:
  en:
    languageName: "English"
    languageCode: "en-US"
    weight: 1
    menu:
      main:
        - name: About
          url: about/
          weight: 5
        - name: Photography
          url: photography/
          weight: 7
        - name: Search
          url: search/
          weight: 10
        - name: Tags
          url: tags/
          weight: 15
  tr:
    languageName: "Türkçe"
    languageCode: "tr-TR"
    weight: 2
    menu:
      main:
        - name: Hakkımda
          url: about/
          weight: 5
        - name: Fotoğrafçılık
          url: photography/
          weight: 7
        - name: Ara
          url: search/
          weight: 10
        - name: Etiketler
          url: tags/
          weight: 15
    params:
      description: "Felsefe, edebiyat, temel bilimler ve popüler kültür üzerine kişisel bir düşünce arşivi."

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  description: "Deconstructing philosophy, literature and pop culture through an analytical lens."
  author: "Alp Yağcıoğlu"
  images:
    - "/images/site-avatar.png"
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true

  profileMode:
    enabled: false
    title: "Alp Yağcıoğlu"
    subtitle: "Computer Engineering Student @PoliTo | Carbon-based Individual"
    imageUrl: "/images/site-avatar.png"
    imageTitle: "Alp"
    imageWidth: 120
    imageHeight: 120
    buttons:
      - name: GitHub
        url: "https://github.com/TheBoyWithDempseyRoll"
      - name: LinkedIn
        url: "https://www.linkedin.com/in/alp-yağcıoğlu-0335a9260/"

  assets:
    disableHLJS: true
    favicon: "/images/site-avatar.png"
    favicon16x16: "/images/site-avatar.png"
    favicon32x32: "/images/site-avatar.png"
    apple_touch_icon: "/images/site-avatar.png"

  label:
    icon: "/images/site-avatar.png"
    iconHeight: 34

markup:
  goldmark:
    renderer:
      unsafe: true
